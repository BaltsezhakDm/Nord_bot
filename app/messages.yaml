start_text_1: | 
  Здравствуйте, {username}!
  Мы рады знакомству с тобой!
  Добро пожаловать в систему лояльности кофейни KOS.PLACE.

start_text_2: |
  Мы начисляем 5% с каждого чека на ваш бонусный счет и в дальнейшем можем списать до 50% суммы чека из ваших бонусов. Если вы бонусы списываете, то с этого чека они не накапливаются.
  В данном чате вы будете видеть зачисления\списания бонусов и ваш баланс.

start_text_3: |
  <b>Нажмите на кнопку "Телефон" для входа или регистрации.</b>

about: |
    <b>Привет, мы команда <a href="https://kosplace.ru/team">KOS.PLACE</a></b>
    Наша кофейня создана с любовью к тебе, к твоему утреннему кофе, важному перекусу, ко встрече с друзьями, ко времени наедине с собой, к твоим будням и выходным. Всё, что мы делаем, мы делаем для тебя!
    Давай познакомимся и станем ещё ближе.
    <b>Что такое Kos?</b>
    Kos — счастье, уют, наслаждение жизнью по-норвежски. Это слово такое ёмкое, что не поддаётся точному словесному переводу. Но поддаётся переводу на уровне ощущений.
    Именно ощущение Kos мы стараемся воплотить в наших кофейнях Петербурга.

